name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Publicar el artefacto por su identificador
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Falta el identificador del artefacto.');
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            const target = { ...context.repo, deployment_id: deployment.id };
            const failures = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', target);
              core.info(`Pages: ${data.status}`);
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failures.includes(data.status)) throw new Error(`No se pudo publicar: ${data.status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', target);
            throw new Error('La publicación excedió diez minutos y fue cancelada.');
